# Device identity, pairing, certificates and Wi-Fi secrets are generated locally.
state_dir = /var/lib/nassimhub
log_dir =
listen = 0.0.0.0:7580
platform = msm8916
model = UFI003
modem_backend = msm8916
plaintext = false
announce = true
provisioning = false
local_admin = true
admin_listen = 0.0.0.0:7581
security_level = STANDARD
pq_identity_policy = optional
ota_signature_policy = preferred
transport_mode = standard
update_channel = stable
# Agent updates are carried by the paired NAS and verified here against the
# release PUBLIC keys below (root-owned; the agent cannot change them). Without
# that file the device accepts no update and reports updates as unsupported.
updates = true
ota_keys = /etc/nassimhub/ota-keys.json
# An ML-DSA identity key beside the Ed25519 one; the device ID does not change.
pq_identity = true
# The Wi-Fi setup access point is off until it has passed hardware acceptance.
provisioning_ap = off
# Enable voice_media only after this specific device passes audio acceptance.
voice_media = false
