# Installed by scripts/package-factory.sh ONLY with NSH_SETUP_AP=on.
#
# While the setup access point is up the agent serves the setup page on
# 192.168.4.1:80 (node/agent/internal/provisioning: DefaultListenAddress). The
# agent runs as the unprivileged user nassimhub and the base unit gives it no
# capability at all, so that bind fails with EACCES: the phone joins the access
# point and the page does not open.
#
# One capability, for this one service. It is added to the bounding set and to
# the ambient set (the base unit empties both; these lines add to the empty
# sets, they do not reset anything else). Ambient, because the process is not
# root and the binary carries no file capability; and an ambient capability
# survives the exec() by which the factory agent starts an installed release,
# so an updated agent can still serve the page.
#
# Alternatives that were not chosen (docs/RELEASING.md has the comparison):
# net.ipv4.ip_unprivileged_port_start=80 opens ports 80-1023 to every user on
# the device, and a socket unit needs an agent that accepts an inherited
# listener, which this one does not.
#
# Every other hardening line of the base unit stays as it is. NoNewPrivileges
# does not affect ambient capabilities.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# CAP_NET_BIND_SERVICE is about every port below 1024, and only 80/tcp is
# wanted. These deny the rest (cgroup BPF; systemd logs a warning and carries
# on without them on a kernel that lacks CONFIG_CGROUP_BPF - the validation
# checklist has a step that tells which is the case). Ports from 1024 up,
# where the agent's own listeners are, and unbound outgoing sockets are not
# affected.
SocketBindDeny=tcp:1-79
SocketBindDeny=tcp:81-1023
SocketBindDeny=udp:1-1023
#
# Not yet verified on hardware; see docs/VALIDATION.md.
