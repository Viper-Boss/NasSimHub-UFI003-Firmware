# Installed by scripts/package-factory.sh ONLY when the image ships release
# public keys (/etc/nassimhub/ota-keys.json).
#
# Agent updates are stored on the state partition as
# /var/lib/nassimhub/agent-releases/<id>/nassimhub-agent and the factory agent
# exec()s the selected release at start (node/agent/ota/installer.go, boot.go).
# The base mount unit says noexec, under which a staged release cannot even be
# validated (the device runs it with -version) and every update would fail.
#
# An image without release keys does not get this file: it can verify no update,
# so nothing on the state partition is ever executed and noexec stays in force.
# nosuid and nodev are kept either way.
#
# Not yet verified on hardware; see docs/VALIDATION.md.
[Mount]
Options=rw,nosuid,nodev
